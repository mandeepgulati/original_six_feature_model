spec:
  task:
    task_id: boc_rate_direction_next_meeting
    target_series_id: boc_rate_decision_direction
    horizons:
    - 28
    frequency: D
    description: At the Bank of Canada fixed announcement date occurring 28 days after
      the forecast origin, will the Bank CUT, HOLD, or HIKE its target for the overnight
      rate? Outcome is the direction of the target-rate change at that announcement
      (any size). Announcements are at 09:45 ET; the forecast must be issued with
      information available four weeks before the announcement, before markets have
      converged on the decision.
    payload_type: categorical
    categories:
    - label: cut
      value: -1.0
    - label: hold
      value: 0.0
    - label: hike
      value: 1.0
    resolution_fn: observed_value_at_resolution_timestamp
